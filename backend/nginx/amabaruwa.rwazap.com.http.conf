# Amabaruwa — vhost HTTP temporaire (avant certificat)
# Sert uniquement au challenge ACME et aux tests HTTP.
# Remplacé par le vhost HTTPS après obtention du certificat.

server {
    listen 80;
    listen [::]:80;
    server_name amabaruwa.rwazap.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/amabaruwa-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location = /_ {
        return 404;
    }
    location ^~ /_/ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }
}
