# Amabaruwa — vhost dédié à amabaruwa.rwazap.com
# Ce fichier ne doit être activé qu'après création du certificat TLS.
# Proxy vers PocketBase sur 127.0.0.1:${AMABARUWA_PORT} (8095 par défaut).
# Ne pas modifier les autres vhosts ni les certificats existants.

server {
    listen 80;
    listen [::]:80;
    server_name amabaruwa.rwazap.com;

    # Challenge ACME Certbot (webroot), conservé aussi en HTTP.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/amabaruwa-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name amabaruwa.rwazap.com;

    ssl_certificate /etc/letsencrypt/live/amabaruwa.rwazap.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/amabaruwa.rwazap.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Téléversements d'administration (PDF/audio) : limite dédiée au vhost.
    client_max_body_size 200M;

    access_log /var/log/nginx/amabaruwa.access.log;
    error_log /var/log/nginx/amabaruwa.error.log;

    # Interface d'administration : accès local via tunnel SSH uniquement.
    location = /_ {
        return 404;
    }
    location ^~ /_/ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Les requêtes Range des médias sont transmises telles quelles.
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SSE PocketBase si le temps réel est activé ultérieurement.
    location ^~ /api/realtime {
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
