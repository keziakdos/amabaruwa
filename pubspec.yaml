name: amabaruwa
description: "Amabaruwa — lecture et écoute des Lettres du Christ en kinyarwanda."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.2
  pocketbase: ^0.25.2
  dio: ^5.11.1
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  just_audio: ^0.10.6
  just_audio_background: ^0.0.1-beta.17
  audio_session: ^0.2.4
  share_plus: ^13.3.1
  intl: ^0.20.3
  connectivity_plus: ^7.3.2
  collection: ^1.19.1
  crypto: ^3.0.8
  url_launcher: ^6.3.3
  html: ^0.15.7
  pdfx: ^2.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.17.1
  mocktail: ^1.0.5
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/brand/
  fonts:
    - family: Lato
      fonts:
        - asset: assets/fonts/Lato-Light.ttf
          weight: 300
        - asset: assets/fonts/Lato-Regular.ttf
          weight: 400
        - asset: assets/fonts/Lato-Bold.ttf
          weight: 700
        - asset: assets/fonts/Lato-Black.ttf
          weight: 900
